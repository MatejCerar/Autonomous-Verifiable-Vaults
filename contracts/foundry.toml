[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../" }]

[fmt]
line_length = 80
tab_width = 4
bracket_spacing = false
quote_style = "double"
